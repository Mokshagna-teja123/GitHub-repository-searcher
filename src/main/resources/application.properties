server.port=${PORT:8080}

# Local default = in-memory H2. In production set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (Postgres).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:repos;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Optional token raises GitHub rate limit from 10 to 30 search req/min
github.api.base-url=https://api.github.com
github.api.token=${GITHUB_TOKEN:}

springdoc.swagger-ui.path=/swagger-ui.html
